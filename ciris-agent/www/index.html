<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIRIS</title>
    <style>
        /* Material Icons font - self-hosted, no CDN dependency */
        @font-face {
            font-family: 'Material Icons';
            font-style: normal;
            font-weight: 400;
            font-display: block;
            src: url(fonts/material-icons.woff2) format('woff2');
        }
        .material-icons {
            font-family: 'Material Icons';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0A0A0F;
            overflow: hidden;
        }
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0A0A0F;
            color: #6B9AFF;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #loading h1 { font-size: 48px; margin-bottom: 16px; }
        #loading p { color: rgba(255,255,255,0.6); }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #1A1A24;
            border-top-color: #6B9AFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <h1>CIRIS</h1>
        <p>Loading...</p>
        <div class="spinner"></div>
    </div>
    <script>
        // CIRIS Debug: Catch all errors
        window.onerror = function(msg, url, line, col, error) {
            console.error('[CIRIS-DEBUG] Global error:', msg);
            console.error('[CIRIS-DEBUG] URL:', url, 'Line:', line);
            console.error('[CIRIS-DEBUG] Error object:', error);
            var loading = document.getElementById('loading');
            if (loading) {
                loading.innerHTML = '<h1 style="color:red">Error</h1><p>' + msg + '</p><p style="font-size:12px">' + url + ':' + line + '</p>';
            }
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            console.error('[CIRIS-DEBUG] Unhandled promise rejection:', event.reason);
            var loading = document.getElementById('loading');
            if (loading) {
                loading.innerHTML = '<h1 style="color:red">Promise Error</h1><p>' + (event.reason?.message || event.reason) + '</p>';
            }
        });
        console.log('[CIRIS-DEBUG] Starting app load...');
        console.log('[CIRIS-DEBUG] Base URL:', window.location.href);
    </script>
    <script src="ciris-web.js"></script>
    <script>
        console.log('[CIRIS-DEBUG] ciris-web.js loaded');
        window.addEventListener('load', function() {
            console.log('[CIRIS-DEBUG] Window load event fired');
            // Poll for canvas creation - Compose may take several seconds to initialize
            var pollCount = 0;
            var maxPolls = 50; // 50 * 200ms = 10 seconds max wait
            var pollInterval = setInterval(function() {
                pollCount++;
                var loading = document.getElementById('loading');
                var canvas = document.querySelector('canvas');
                if (canvas && canvas.width > 300) {
                    console.log('[CIRIS-DEBUG] Canvas found after ' + (pollCount * 200) + 'ms:', canvas.width + 'x' + canvas.height);
                    console.log('[CIRIS-DEBUG] Compose initialized, hiding loading');
                    if (loading) loading.style.display = 'none';
                    clearInterval(pollInterval);
                } else if (pollCount >= maxPolls) {
                    console.log('[CIRIS-DEBUG] Canvas NOT found after 10s, keeping loading visible');
                    clearInterval(pollInterval);
                }
            }, 200);
        });
    </script>
</body>
</html>
